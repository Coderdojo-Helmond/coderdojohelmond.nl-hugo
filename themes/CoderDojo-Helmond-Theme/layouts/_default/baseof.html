<!DOCTYPE html>
<html lang="{{ or site.Language.LanguageCode site.Language.Lang }}" dir="{{ or site.Language.LanguageDirection `ltr` }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="font-sans">
  {{ partial "navbar.html" . }}
  {{ block "main" . }}{{end}}
  {{ $isDojo := in .Params.tag "Edities" }}
  <footer id="footer" class="bg-[#343a40] {{ if or .Params.notscrollable $isDojo }}fixed bottom-0 w-full{{ end }}">
    {{ partial "footer.html" . }}
  </footer>
</body>
</html>
